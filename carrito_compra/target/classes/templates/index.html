<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de Conveniencia</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="container">
  <header class="bar">
    <h1>Tienda de Conveniencia </h1>
    <nav><a href="/cart">Ver carrito</a></nav>
  </header>

  <h2>Productos</h2>
  <div class="grid">
    <div class="card" th:each="p : ${products}">
      <img th:if="${p.imageUrl}" th:src="${p.imageUrl}" alt="img" />
      <h3 th:text="${p.name}">Nombre</h3>
      <p th:text="${p.description}">Desc</p>
      <strong>$<span th:text="${p.price}">0.00</span></strong>
      <form method="post" action="/cart/add">
        <input type="hidden" name="productId" th:value="${p.id}" />
        <input type="number" name="qty" value="1" min="1" />
        <button type="submit">Agregar</button>
      </form>
    </div>
  </div>

  <h2>Alta rápida</h2>
  <form method="post" action="/product" class="card">
    <input name="name" placeholder="Nombre" required />
    <input name="description" placeholder="Descripción" />
    <input name="price" type="number" step="0.01" placeholder="Precio" required />
    <input name="imageUrl" placeholder="URL de imagen (opcional)" />
    <button>Crear</button>
  </form>
</div>
</body>
</html>
